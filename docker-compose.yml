####################################################
# PC HUB 2.0 — Docker Compose
# Usage:
#   docker-compose up -d --build
#
# On first run the postgres container auto-executes
# 001_schema.sql then seed.sql from initdb.d mounts.
# Subsequent runs reuse the postgres_data volume.
####################################################

services:

  # ──────────────────────────────────────────────
  # PostgreSQL 16
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-perfect_circle}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jaiBhole@01}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-initialise schema + seed on first boot (skipped if volume already has data)
      - ./backend/prisma/migrations/001_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/prisma/seeds/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-perfect_circle}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ──────────────────────────────────────────────
  # API  (NestJS)
  # ──────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV:       production
      PORT:           3000
      DATABASE_URL:   postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-jaiBhole@01}@postgres:5432/${POSTGRES_DB:-perfect_circle}?schema=public
      JWT_SECRET:     ${JWT_SECRET:-c7b9be3f534fe915db197637fe7b38036e8c3b749efe3b2c3f2cae7eb408c5bfa8de20d4774424b1df9b6e5a0dfe6110be8607d8f01ba8ce05ed7b192ea381ce}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGINS:   ${CORS_ORIGINS:-http://localhost}
      THROTTLE_TTL:   ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-200}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    # Uncomment to expose API directly (useful for debugging)
    # ports:
    #   - "3000:3000"

  # ──────────────────────────────────────────────
  # Frontend  (Angular + nginx proxy)
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: .                                          # project root
      dockerfile: infrastructure/docker/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
