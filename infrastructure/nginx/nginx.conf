worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  multi_accept on;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_referer" rt=$request_time';
  access_log /var/log/nginx/access.log main buffer=16k flush=5s;
  error_log  /var/log/nginx/error.log warn;

  sendfile on; tcp_nopush on; tcp_nodelay on;
  keepalive_timeout 65; keepalive_requests 1000;
  client_max_body_size 50m; server_tokens off;

  gzip on; gzip_vary on; gzip_proxied any; gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;

  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=api:10m     rate=30r/s;
  limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

  upstream pchub_api      { server api:3000      max_fails=3 fail_timeout=30s; keepalive 32; }
  upstream pchub_frontend { server frontend:80;              keepalive 16; }

  # HTTP → HTTPS redirect
  server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name pchub.perfectcircle.co.uk;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on; ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self';" always;

    # API proxy
    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://pchub_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 90s;
      proxy_connect_timeout 10s;
      proxy_cache_bypass $http_upgrade;
    }

    # Health check (no rate limit, no logging)
    location = /health {
      proxy_pass http://pchub_api/api/health;
      access_log off;
    }

    # Static assets (long cache)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      proxy_pass http://pchub_frontend;
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    # Angular SPA
    location / {
      limit_req zone=general burst=20 nodelay;
      proxy_pass http://pchub_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
