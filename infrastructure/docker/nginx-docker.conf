##############################################################
# nginx-docker.conf
# Used inside the frontend Docker container.
# Serves the Angular SPA and proxies /api/* to the api service.
##############################################################

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Aggressive caching for hashed static assets ────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── API reverse-proxy → NestJS backend ─────────────────
    # The angular production build uses apiUrl: '/api' so all
    # XHR requests arrive here as  GET /api/v1/...
    location /api/ {
        proxy_pass         http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade     $http_upgrade;
        proxy_set_header   Connection  'upgrade';
        proxy_set_header   Host        $host;
        proxy_set_header   X-Real-IP   $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Health check (no logging) ───────────────────────────
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
        access_log off;
    }

    # ── Angular SPA fallback ───────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
