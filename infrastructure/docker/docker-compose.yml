version: '3.9'

services:
  # ── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pchub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pchub}
      POSTGRES_USER: ${POSTGRES_USER:-pchub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../backend/prisma/migrations/001_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../../backend/prisma/seeds/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pchub} -d ${POSTGRES_DB:-pchub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256m
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
        -c max_connections=200
        -c wal_buffers=64MB
        -c checkpoint_completion_target=0.9

  # ── Redis (queue/cache) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pchub_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS API ────────────────────────────────────────────────
  api:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/Dockerfile.api
      target: production
    container_name: pchub_api
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-pchub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pchub}?schema=public&connection_limit=20
      REDIS_URL: redis://redis:6379
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    expose:
      - "3000"

  # ── Angular Frontend ──────────────────────────────────────────
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
      args:
        API_URL: /api
    container_name: pchub_frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api

  # ── nginx Reverse Proxy ───────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: pchub_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
